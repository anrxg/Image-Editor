<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>

        <section>
            <div class="left">
                <div class="top">
                    <label for="image-input" id="choose-img" class="btn">
                        Choose Image
                        <input type="file" accept="image/*" id="image-input" class="btn" hidden>
                    </label>
                    <button id="reset-btn" class="btn">Reset</button>
                    <button id="download-btn" class="btn">Download Image</button>
                </div>
                <div class="bottom">
                    <div class="placeholder">
                        <i class="ri-image-line"></i>
                        <p>No Image Chosen</p>
                    </div>
                    <canvas id="image-canvas">

                    </canvas>
                </div>
                <div class="presets">
                    <h2>Presets</h2>
                    <div class="presets-container" id="presets-container">
                    </div>
                </div>
            </div>
            <div class="right">
                <h2>Filters</h2>
                <div class="filters">
                </div>

            </div>
        </section>

    </main>
    <script src="script.js"></script>
</body>

</html>
